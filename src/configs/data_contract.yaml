datasets:

  movies:
    file: movies.csv

    required_columns:
      movieId: integer
      title: string
      genres: string

    primary_key:
      - movieId

    nullable_columns: []

    positive_columns:
      - movieId

    non_empty_columns:
      - title
      - genres

    timestamp_columns: []

  ratings:
    file: ratings.csv

    required_columns:
      userId: integer
      movieId: integer
      rating: float
      timestamp: integer

    primary_key:
      - userId
      - movieId

    nullable_columns: []

    positive_columns:
      - userId
      - movieId

    non_empty_columns: []

    timestamp_columns:
      - timestamp

    rating:
      column: rating
      min: 0.5
      max: 5.0
      increment: 0.5

  tags:
    file: tags.csv

    required_columns:
      userId: integer
      movieId: integer
      tag: string
      timestamp: integer

    primary_key: []

    nullable_columns: []

    positive_columns:
      - userId
      - movieId

    non_empty_columns:
      - tag

    timestamp_columns:
      - timestamp

  links:
    file: links.csv

    required_columns:
      movieId: integer
      imdbId: integer
      tmdbId: float

    primary_key:
      - movieId

    nullable_columns:
      - tmdbId

    positive_columns:
      - movieId
      - imdbId

    non_empty_columns: []

    timestamp_columns: []

relationships:
  - child_dataset: ratings
    child_column: movieId
    parent_dataset: movies
    parent_column: movieId

  - child_dataset: tags
    child_column: movieId
    parent_dataset: movies
    parent_column: movieId

  - child_dataset: links
    child_column: movieId
    parent_dataset: movies
    parent_column: movieId

metadata_rules:
  duplicate_movie_titles:
    dataset: movies
    column: title
    severity: INFO

  missing_tmdb_ids:
    dataset: links
    column: tmdbId
    severity: WARNING
